# zelto policy — v1
# Default policy for zelto-managed projects

rules:
  # Allow writing to source code
  - id: allow-src-ts
    match: { path: "src/**/*.ts", operation: "write" }
    action: allow
    basis: "policy.yaml#allow-src-ts"
  - id: allow-root-package
    match: { path: "package.json" }
    action: allow
    basis: "plan-1795507341754#v1-version-align"
  - id: allow-root-lockfile
    match: { path: "package-lock.json" }
    action: allow
    basis: "plan-1795507341754#v1-version-align"
  - id: allow-scripts-mjs
    match: { path: "scripts/**/*.mjs" }
    action: allow
    basis: "plan-1795507341754#v1"
  - id: allow-scripts-tagmap
    match: { path: "scripts/tag-map.json" }
    action: allow
    basis: "plan-1795507341754#v2-tag-namespace"
  # 版本计划的跟踪副本（ADR-110 决策六）。
  #
  # 为什么需要这条规则：`versions/<planId>.json` 是**规格**（人批准的产物），
  # 不是运行时状态 —— 它必须被 git 跟踪，CI 才能读出 plan↔tag 关系。
  # 没有这条规则时它落在 default deny，agent 写不进去。
  #
  # 范围只限 `versions/*.json` —— 副本目录里不该有别的东西。
  - id: allow-tracked-version-plans
    match: { path: "versions/*.json" }
    action: allow
    basis: "docs/adr/adr-110-version-tag-plan-scoped-namespace.md#决策六"


  - id: allow-ci-workflow
    match: { path: ".github/**", operation: "write" }
    action: allow
    basis: "policy.yaml#allow-ci-workflow"

  # Allow writing to test files
  - id: allow-tests
    match: { path: "tests/**/*.ts", operation: "write" }
    action: allow
    basis: "policy.yaml#allow-tests"

  # Deny direct modification of acceptance tests
  - id: deny-acceptance-direct
    match: { path: "tests/acceptance/**", operation: "write" }
    action: deny
    basis: "AGENTS.md#禁区-5"
    guidance: "Acceptance tests are frozen with the spec. Modify the spec instead."

  # Allow reading all project files
  - id: allow-read-all
    match: { path: "**", operation: "read" }
    action: allow
    basis: "policy.yaml#allow-read-all"
    priority: 0

  # Allow docs edits
  - id: allow-docs
    match: { path: "docs/**", operation: "write" }
    action: allow
    basis: "policy.yaml#allow-docs"

  # Allow contract schema edits (ADR-100: event-envelope hash chain fields)
  - id: allow-contracts
    match: { path: "contracts/**", operation: "write" }
    action: allow
    basis: "policy.yaml#allow-contracts"

  # Allow config edits (with human oversight)
  - id: allow-config
    match: { path: ".zelto/config.yaml", operation: "write" }
    action: ask
    basis: "policy.yaml#allow-config"
    guidance: "Changing project configuration requires human review."

# 架构护栏（ADR-027）：给偏离定级。未列出的类别一律按 deny 处理（fail closed）。
#
# 本仓**不放任何豁免** —— 六类硬偏离全部走默认 deny。
#
# 曾经开过一条豁免：cycle -> ask，理由是 src/core/gate ↔ src/core/slice 的模块级成环。
# ADR-031 把 SliceType 归位到 core/slice/kind.ts 之后，core/slice 不再依赖 core/gate，
# 环已经消失、重建基线后偏离归零，这条豁免按 ADR-030 §3.3 写下的收紧条件撤销。
#
# 要放开某一类时，在这里显式写一条 kind + action + basis + guidance；
# 写清楚「为什么开、什么时候收」，否则护栏就退化成「不配所以不拦」。
# （ADR-031 §3.4）
