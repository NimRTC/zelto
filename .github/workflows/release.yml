name: Release

# 发布到 npm —— 唯一对外分发通道（D4 决策 A，见 docs/zelto-项目目标.md §7）。
#
# 触发方式：打 tag 触发。两类 tag 都会触发流水线：
#   · 纯 semver tag `v<version>`（如 v0.5.0）
#   · 计划版本 tag `plan-<semver>/v<n>`（如 plan-0.7.1/v1，见 docs/tag-namespace.md）
# tag 的命名合法性与版本号一致性由 scripts/tag-namespace.mjs 唯一判定，
# workflow 只调用它，不手写第二套判定（ADR-106 §5）。
#
# 需要配置两个 secret：
#   NPM_TOKEN   —— npm 的 automation token（发布用，勾选 2FA 时仍可用）
#   （可选）NPM_PROVENANCE —— 不需要，provenance 走 GitHub OIDC 自动完成

on:
  push:
    tags:
      - 'v*'
      - 'plan-*/v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: '只打包验证，不真正发布'
        type: boolean
        default: true

permissions:
  # 发布后要把 `release-status.json` 翻成 published: true 并提交回去 ——
  # 那是发布状态的真源（README 与 CHANGELOG 都跟它对齐）。只有 read 的话
  # 那一步会 403，"发布完了但文档还说没发布" 就又发生了（ADR-085）。
  contents: write
  id-token: write # npm provenance 用 OIDC，不要这个权限 provenance 签不了

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验 tag 命名空间与版本一致性
        # 这里判**两件不同的事**，判据不同源，别混成一件：
        #
        #   ① 命名合法性（这个 tag 是不是合法的命名空间形态）
        #      → 唯一判据是 scripts/tag-namespace.mjs，workflow 只**调用**它，
        #        不复制它的规则（ADR-106 §5：同一问题两处判定必然走偏）。
        #      → 非交互喂入：把触发本次流水线的 tag 名显式传进去，
        #        不依赖脚本的 stdin/git 兜底（CI 里 stdin 可能挂起等待输入）。
        #
        #   ② 版本号一致性（这个 tag 指的版本是不是仓库当前要发的那个版本）
        #      → 必须**留在 workflow 里**。
        #      → 为什么不能省：tag-namespace.mjs 按设计**不管纯 semver tag 的版本一致性**
        #        （实测 `node scripts/tag-namespace.mjs v0.6.0` 在 package.json 为 0.7.1 时
        #        退出码 0 —— checkTag 对 SEMVER_TAG 直接 return null）。
        #        它只在**命名空间 tag** 上校版本。
        #        若把这条也交给脚本，就等于**静默削掉**「发出去的包和仓库对不上」那条保护：
        #        打一个 v0.6.0 的 tag 就能把 0.7.1 的包发出去。
        #        「多一条校验」与「换掉一条校验」不是一回事 —— 这里是前者。
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            echo "待校验 tag：${TAG}"
            echo "${TAG}" | node scripts/tag-namespace.mjs

            # 版本号一致性：tag 指的版本必须 == package.json 的 version。
            # 两种 tag 形态都要校 —— 命名空间 tag 取 `plan-<semver>/v<n>` 里的 <semver>，
            # 纯 semver tag 取 `v<semver>` 里的 <semver>。
            PKG=$(node -p "require('./package.json').version")
            case "${TAG}" in
              plan-*/v*) TAG_SEMVER="${TAG#plan-}"; TAG_SEMVER="${TAG_SEMVER%%/*}" ;;
              v*)         TAG_SEMVER="${TAG#v}" ;;
              *)          TAG_SEMVER="" ;;
            esac
            if [ -z "${TAG_SEMVER}" ]; then
              echo "::error::tag ${TAG} 里认不出版本号，无法与 package.json 对齐"
              exit 1
            fi
            if [ "${TAG_SEMVER}" != "${PKG}" ]; then
              echo "::error::tag ${TAG} 的版本号 ${TAG_SEMVER} 与 package.json 的 version ${PKG} 不一致"
              exit 1
            fi
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: 编码与凭据扫描
        run: |
          pnpm check:encoding
          pnpm check:credentials

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm test

      # 打包后装到干净目录里跑一遍 —— 白名单少一个文件，npm publish 照样成功，
      # 只是装出来的包在某个命令上炸掉（见 tests/package-availability.test.ts）。
      - name: 验证发布产物装出来能用
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          npm pack --pack-destination "$TMP"
          mkdir -p "$TMP/probe" && cd "$TMP/probe"
          echo '{"name":"probe","version":"1.0.0"}' > package.json
          npm install "$TMP"/zelto-*.tgz --no-audit --no-fund
          node node_modules/zelto/dist/cli/index.js --version
          mkdir -p "$TMP/probe/proj" && cd "$TMP/probe/proj"
          node ../node_modules/zelto/dist/cli/index.js init
          test -f policy/lock.json

      - name: 发布到 npm
        if: ${{ !inputs.dry-run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      # 发布状态的真源是仓库里的 `release-status.json`（C1：状态只在文件里）。
      #
      # 为什么要有这一步：README 与 CHANGELOG 的发布措辞都跟它对齐。
      # 少了这一步，「发布完了但文档还说没发布」就会发生 ——
      # 而那种不一致已经害过人（README 写着「已发布到 npm」时，npm 上是 404）。
      - name: 更新发布状态并提交
        if: ${{ !inputs.dry-run }}
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          node -e "
            const fs = require('fs');
            const p = 'release-status.json';
            const s = JSON.parse(fs.readFileSync(p, 'utf-8'));
            s.published = true;
            s.publishedAt = new Date().toISOString();
            s.npmVersion = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(s, null, 2) + '\n', 'utf-8');
          " "$PKG"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # tag 触发时 checkout 出来是 detached HEAD —— 直接 commit 会挂在
          # 一个游离的 HEAD 上，push 无处可去（"not currently on a branch"）。
          # 所以先落到目标分支上，再 push。
          #
          # 用远端分支的尖端做基，而不是 detached HEAD 的 commit ——
          # 否则 main 在 tag 之后又前进了的话，push 就是非快进，会被拒。
          BRANCH="${GITHUB_REF_TYPE == 'tag' && echo main || echo ${GITHUB_REF_NAME}}"
          git fetch --no-tags origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          git add release-status.json
          git commit -m "chore(release): 标记 ${PKG} 已发布到 npm" || echo "（无改动，跳过）"
          git push origin "HEAD:${BRANCH}" || {
            echo "::error::推送 release-status.json 失败 —— published 状态需手动置为 true"
            exit 1
          }

      - name: 仅打包（dry run）
        if: ${{ inputs.dry-run }}
        run: npm publish --dry-run
