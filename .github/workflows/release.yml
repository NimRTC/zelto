name: Release

# 发布到 npm —— 唯一对外分发通道（D4 决策 A，见 docs/zelto-项目目标.md §7）。
#
# 触发方式：打 tag `v<version>`（如 v0.5.0）。tag 上的版本号必须与
# package.json 的 version 一致，不一致直接失败 —— 发出去的包和仓库对不上，
# 比不发更糟。
#
# 需要配置两个 secret：
#   NPM_TOKEN   —— npm 的 automation token（发布用，勾选 2FA 时仍可用）
#   （可选）NPM_PROVENANCE —— 不需要，provenance 走 GitHub OIDC 自动完成

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: '只打包验证，不真正发布'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance 用 OIDC，不要这个权限 provenance 签不了

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验 tag 版本与 package.json 一致
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            PKG=$(node -p "require('./package.json').version")
            if [ "v${PKG}" != "${TAG}" ]; then
              echo "::error::tag ${TAG} 与 package.json 的 version ${PKG} 不一致"
              exit 1
            fi
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: 编码与凭据扫描
        run: |
          pnpm check:encoding
          pnpm check:credentials

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm test

      # 打包后装到干净目录里跑一遍 —— 白名单少一个文件，npm publish 照样成功，
      # 只是装出来的包在某个命令上炸掉（见 tests/package-availability.test.ts）。
      - name: 验证发布产物装出来能用
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          npm pack --pack-destination "$TMP"
          mkdir -p "$TMP/probe" && cd "$TMP/probe"
          echo '{"name":"probe","version":"1.0.0"}' > package.json
          npm install "$TMP"/zelto-*.tgz --no-audit --no-fund
          node node_modules/zelto/dist/cli/index.js --version
          mkdir -p "$TMP/probe/proj" && cd "$TMP/probe/proj"
          node ../node_modules/zelto/dist/cli/index.js init
          test -f policy/lock.json

      - name: 发布到 npm
        if: ${{ !inputs.dry-run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      # 发布状态的真源是仓库里的 `release-status.json`（C1：状态只在文件里）。
      #
      # 为什么要有这一步：README 与 CHANGELOG 的发布措辞都跟它对齐。
      # 少了这一步，「发布完了但文档还说没发布」就会发生 ——
      # 而那种不一致已经害过人（README 写着「已发布到 npm」时，npm 上是 404）。
      - name: 更新发布状态并提交
        if: ${{ !inputs.dry-run }}
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          node -e "
            const fs = require('fs');
            const p = 'release-status.json';
            const s = JSON.parse(fs.readFileSync(p, 'utf-8'));
            s.published = true;
            s.publishedAt = new Date().toISOString();
            s.npmVersion = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(s, null, 2) + '\n', 'utf-8');
          " "$PKG"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-status.json
          git commit -m "chore(release): 标记 v${PKG} 已发布到 npm" || echo "（无改动，跳过）"
          git push || echo "⚠️  推送失败 —— 请手动把 published 置为 true"

      - name: 仅打包（dry run）
        if: ${{ inputs.dry-run }}
        run: npm publish --dry-run
