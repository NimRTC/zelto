name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: DCO check
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          fail=0
          for c in $(git rev-list "$BASE..HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q "^Signed-off-by:"; then
              echo "::error::commit $c is missing Signed-off-by (use: git commit -s)"
              fail=1
            fi
          done
          exit $fail

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Credential scan
        env:
          # 私有名单（公司域名、私有 token 前缀等）不入库，放在 GitHub Secret 里，
          # 加密存储。仓库内只保留通用形态；这里在跑扫描前临时还原成本地名单文件，
          # 让 CI 也能拦下「专有标识误入版本库」。
          ZELTO_CREDENTIAL_PATTERNS: ${{ secrets.ZELTO_CREDENTIAL_PATTERNS }}
        run: |
          if [ -n "$ZELTO_CREDENTIAL_PATTERNS" ]; then
            mkdir -p .zelto
            printf '%s' "$ZELTO_CREDENTIAL_PATTERNS" > .zelto/credential-patterns.local.json
          fi
          pnpm check:credentials

      - run: pnpm build

      - run: pnpm test

      - run: pnpm lint
